name: ci

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Same as the Dockerfile: tests import the `src` package from the repo root.
      PYTHONPATH: .
      # Unit tests load config_test.yml, which requires a SECRET_KEY (>= 32 chars, not the .env.example placeholder).
      SECRET_KEY: ci-only-jwt-secret-key-not-used-anywhere-else
    # Throwaway database for the migration check below; credentials match src/app/config/config_test.yml.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: open-projects-hub-admin
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: open-projects-hub-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open-projects-hub-admin -d open-projects-hub-db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt ruff==0.15.14 "bandit[toml]==1.9.4" mypy==2.3.1

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Security scan
        run: bandit -c pyproject.toml -r src/app

      # Informational: the codebase has known mypy errors and `make type-check` also never fails.
      - name: Type check
        continue-on-error: true
        run: mypy src/app --config-file=pyproject.toml

      - name: Unit tests
        run: APP_ENV=test pytest --ignore=src/tests/integration/ -m "not integration" -v

      # Production runs `alembic upgrade head` at container start, so prove every migration applies
      # to an empty Postgres and rolls back. The repository integration tests are not run: 44 of
      # them fail on stale code, unrelated to the database, and need repair first.
      - name: Migrations apply and roll back
        run: |
          export APP_ENV=test
          alembic upgrade head
          alembic downgrade base
