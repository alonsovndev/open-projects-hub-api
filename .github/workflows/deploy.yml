name: deploy

# Deploys the tagged release to the EC2 host managed by open-projects-hub-infra.
# Trigger: push a tag vX.Y.Z, or run manually from a tag ref to redeploy it.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}
  # Matches aws_ssm_document in open-projects-hub-infra/modules/github-oidc.
  SSM_DOCUMENT: ophub-prod-deploy

jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a vX.Y.Z tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Run this workflow from a vX.Y.Z tag (got $GITHUB_REF_TYPE $RELEASE_TAG)." >&2
            exit 1
          fi

      - name: Require the API_URL repository variable
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          # Checked up front: the smoke test at the end would otherwise fail after prod changed.
          if [ -z "$API_URL" ]; then
            echo "Set the API_URL repository variable (https://<api hostname>)." >&2
            exit 1
          fi

      # Tag protection limits who can tag, not what is tagged. main only receives merged pull
      # requests, which ran CI.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $RELEASE_TAG points at a commit that is not on main. Merge it into main first." >&2
            exit 1
          fi

  image:
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # First release only: set the package to Public in GitHub (Packages > settings), or the host cannot pull it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      # The host pulls the image without credentials, so a private package fails the deploy only
      # after the polling loop. Fail early with the fix instead.
      - name: Require a publicly pullable image
        run: |
          docker logout ghcr.io > /dev/null 2>&1 || true
          if ! docker manifest inspect "ghcr.io/$GITHUB_REPOSITORY:$RELEASE_TAG" > /dev/null; then
            echo "The host pulls without credentials. Set the GHCR package open-projects-hub-api to Public (GitHub > Packages > Package settings)." >&2
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run deploy on the host
        env:
          INSTANCE_ID: ${{ vars.API_INSTANCE_ID }}
        run: |
          command_id=$(aws ssm send-command \
            --document-name "$SSM_DOCUMENT" \
            --targets "Key=instanceids,Values=$INSTANCE_ID" \
            --parameters "tag=$RELEASE_TAG" \
            --query Command.CommandId --output text)

          status=Pending
          for attempt in $(seq 1 120); do
            if ! status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>&1); then
              # The invocation record appears a moment after send-command; anything else is a real error.
              case "$status" in
                *InvocationDoesNotExist*) status=Pending ;;
                *) echo "$status" >&2; exit 1 ;;
              esac
            fi
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2

          echo "SSM command status: $status"
          [ "$status" = Success ]

      # The host check only proves the API answers locally. This proves Cloudflare reaches Caddy
      # and /v1/* is routed to the API: an API error is JSON, while Caddy's 404 and Cloudflare
      # error pages (52x) are not.
      - name: Smoke test through Cloudflare
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          # Retried because Caddy and the API may still be settling right after the deploy.
          for attempt in $(seq 1 12); do
            result=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' \
              "$API_URL/v1/users/me/profile" || true)
            echo "GET /v1/users/me/profile -> $result"
            case "$result" in
              4??" application/json"*) exit 0 ;;
            esac
            sleep 5
          done
          echo "Expected a JSON 4xx from the API (unauthenticated request)." >&2
          exit 1
