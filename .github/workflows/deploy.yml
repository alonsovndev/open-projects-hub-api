name: deploy

# Builds and publishes the image for a release tag. The AWS account's service control policies
# forbid IAM OIDC providers, so this workflow cannot reach AWS: deploy with scripts/deploy-release.sh.
# Trigger: push a tag vX.Y.Z, or run manually from a tag ref to rebuild it.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a vX.Y.Z tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Run this workflow from a vX.Y.Z tag (got $GITHUB_REF_TYPE $RELEASE_TAG)." >&2
            exit 1
          fi

      # Tag protection limits who can tag, not what is tagged. main only receives merged pull
      # requests, which ran CI.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $RELEASE_TAG points at a commit that is not on main. Merge it into main first." >&2
            exit 1
          fi

  image:
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # First release only: set the package to Public in GitHub (Packages > settings), or the host cannot pull it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
