name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Mondays at 8:00 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      
      - name: Run pip-audit on requirements.txt
        run: |
          pip-audit --requirement requirements.txt --format json --output audit-results.json || true
          pip-audit --requirement requirements.txt
        continue-on-error: false
      
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: audit-results.json
          retention-days: 30
      
      - name: Check for high severity vulnerabilities
        run: |
          # Install jq for JSON parsing
          sudo apt-get update && sudo apt-get install -y jq
          
          # Check if audit results file exists and has vulnerabilities
          if [ -f audit-results.json ]; then
            # Count high and critical severity vulnerabilities
            HIGH_COUNT=$(jq '[.vulnerabilities[] | select(.severity == "high")] | length' audit-results.json)
            CRITICAL_COUNT=$(jq '[.vulnerabilities[] | select(.severity == "critical")] | length' audit-results.json)
            
            echo "Critical vulnerabilities found: $CRITICAL_COUNT"
            echo "High severity vulnerabilities found: $HIGH_COUNT"
            
            # Fail if any critical or high severity vulnerabilities are found
            if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
              echo "❌ Build failed: Found $CRITICAL_COUNT critical and $HIGH_COUNT high severity vulnerabilities"
              exit 1
            else
              echo "✅ No critical or high severity vulnerabilities found"
            fi
          else
            echo "⚠️ Warning: audit-results.json not found"
            exit 1
          fi
