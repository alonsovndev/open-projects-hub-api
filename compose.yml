services:
  app:
    container_name: open_projects_hub_api_app
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy  # Wait for postgres to be healthy
    env_file:
    - .env
    environment:
      APP_ENV: container
    ports:
    - 8080:8080
    # command inherited from Dockerfile ENTRYPOINT
    networks:
    - open_projects_hub_network

  seed-admin:
    container_name: open_projects_hub_api_seed_admin
    build:
      context: .
    profiles:
    - seed
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
    - .env
    environment:
      APP_ENV: container
    entrypoint: [python, scripts/seed_admin.py]
    networks:
    - open_projects_hub_network

  postgres:
    image: postgres:15
    container_name: open_projects_hub_api_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: open-projects-hub-admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: open-projects-hub-db
    ports:
    - 5432:5432
    env_file:
    - .env
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U open-projects-hub-admin -d open-projects-hub-db]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - open_projects_hub_network

volumes:
  postgres_data:

networks:
  open_projects_hub_network:
    driver: bridge
