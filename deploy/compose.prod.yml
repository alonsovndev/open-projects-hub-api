# Production stack on the single EC2 host (see open-projects-hub-infra).
# Variables come from /opt/ophub/.env, written by deploy.sh from SSM Parameter Store.
name: ophub

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      ORIGIN_VERIFY: ${ORIGIN_VERIFY:?ORIGIN_VERIFY is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ghcr.io/alonsovndev/open-projects-hub-api:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: prod
      POSTGRES_HOST: postgres
      GUNICORN_WORKERS: "1"
      # Only Caddy can reach this container; Caddy overwrites X-Forwarded-For with its own peer.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:15.8
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=64MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-open-projects-hub-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-open-projects-hub-db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off, from /opt/ophub (ADMIN_PASSWORD needs a letter and a digit):
  #   docker compose -f compose.prod.yml --profile seed run --rm \
  #     -e ADMIN_EMAIL=you@example.com -e ADMIN_PASSWORD='...' seed-admin
  seed-admin:
    profiles: [seed]
    image: ghcr.io/alonsovndev/open-projects-hub-api:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file: .env
    environment:
      APP_ENV: prod
      POSTGRES_HOST: postgres
    entrypoint: ["python", "scripts/seed_admin.py"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
