[project]
name = "open-projects-hub-api"
version = "1.0.0"
description = "FastAPI backend for Open Projects Hub"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# ==================== Ruff Configuration ====================
[tool.ruff]
# Line length
line-length = 100
target-version = "py311"

# Source directories
src = ["src", "scripts"]
extend-exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "htmlcov",
    ".coverage",
    "alembic/versions",
    "*.egg-info",
    "dist",
    "build",
]

[tool.ruff.lint]
# Enable comprehensive rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
    "N",      # pep8-naming
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "DTZ",    # flake8-datetimez (timezone aware)
    "T20",    # flake8-print
    "PIE",    # flake8-pie
    "COM",    # flake8-commas
    "Q",      # flake8-quotes
    "RET",    # flake8-return
]

# Ignore specific rules
ignore = [
    "E501",    # Line too long (handled by formatter)
    "B008",    # Do not perform function calls in argument defaults (FastAPI Depends pattern)
    "S101",    # Use of assert (common in tests)
    "S104",    # Possible binding to all interfaces
    "ARG001",  # Unused function argument (common in FastAPI route dependencies)
    "ARG002",  # Unused method argument
    "TCH001",  # Move into type-checking block (conflicts with Pydantic)
    "TCH002",  # Move into type-checking block (conflicts with FastAPI)
    "TCH003",  # Move into type-checking block
    "COM812",  # Trailing comma missing (conflicts with formatter)
    "PTH123",  # Path.open() (not critical)
    "RUF012",  # Mutable class attributes (common in SQLAlchemy models)
    "N805",    # First argument of a method should be named `self` (FastAPI patterns)
]

# Allow autofix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules in specific files/directories
"__init__.py" = ["F401"]  # Unused imports in __init__.py
"src/tests/**/*.py" = [
    "S101",    # Use of assert
    "ARG001",  # Unused function arguments (fixtures)
    "S105",    # Possible hardcoded password (test data)
    "S106",    # Possible hardcoded password (test data)
    "PLR2004", # Magic value used in comparison
]
"alembic/**/*.py" = [
    "E402",    # Module level import not at top
    "F401",    # Unused imports
    "N999",    # Invalid module name
]
"scripts/**/*.py" = [
    "T20",     # Print statements allowed in scripts
]
"src/app/gunicorn_conf.py" = ["ALL"]  # Ignore all rules in gunicorn config

[tool.ruff.lint.isort]
# Import sorting configuration
known-first-party = ["src"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
combine-as-imports = true
split-on-trailing-comma = false
lines-after-imports = 2

[tool.ruff.lint.mccabe]
# Maximum cyclomatic complexity
max-complexity = 10

[tool.ruff.lint.pydocstyle]
# Docstring convention
convention = "google"

[tool.ruff.lint.pylint]
# Pylint-style rules
max-args = 7
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.format]
# Formatter configuration
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ==================== Pytest Configuration ====================
[tool.pytest.ini_options]
# Test discovery
pythonpath = ["src"]
testpaths = ["src/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Async configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Output options
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--color=yes",
]

# Test markers
markers = [
    "unit: Unit tests (domain/application layer with mocked dependencies)",
    "integration: Integration tests (endpoint tests with mocked use cases)",
    "e2e: End-to-end tests (require database)",
    "slow: Slow running tests",
    "auth: Authentication related tests",
]

# Warnings
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ==================== Coverage Configuration ====================
[tool.coverage.run]
source = ["src/app"]
branch = true
parallel = false
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/venv/*",
    "*/virtualenv/*",
    "src/app/gunicorn_conf.py",
    "src/main.py",
    "alembic/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
sort = "Cover"

# Lines to exclude from coverage
exclude_lines = [
    # Standard pragmas
    "pragma: no cover",
    "raise NotImplementedError",

    # Type checking
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",

    # Debugging code
    "def __repr__",
    "def __str__",

    # Non-runnable code
    "if __name__ == .__main__.:",

    # Abstract methods
    "@abstractmethod",
    "@abc.abstractmethod",

    # Protocols
    "@staticmethod",
    "@property",

    # Defensive assertions
    "raise AssertionError",
    "raise ValueError",

    # Pass statements
    "pass",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"
title = "Open Projects Hub API - Test Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
show_contexts = true

# ==================== MyPy Configuration ====================
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

# Exclude directories
exclude = [
    "^alembic/",
    "^venv/",
    "^.venv/",
    "^htmlcov/",
]

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ==================== Bandit Configuration ====================
[tool.bandit]
targets = ["src/app"]
exclude_dirs = [
    "/tests/",
    "/venv/",
    "/.venv/",
]
skips = [
    "B101",  # assert_used (common in tests)
    "B601",  # paramiko_calls
]
