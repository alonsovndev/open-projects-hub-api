[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = -v --tb=short

# Markers
markers =
    unit: Unit tests (domain/application layer with mocked dependencies)
    integration: Integration tests (endpoint tests with mocked use cases)
    e2e: End-to-end tests (require database)
    slow: Slow running tests
    auth: Authentication related tests

# Test paths
testpaths = src/tests

# Coverage options
[coverage:run]
source = src/app
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    src/app/gunicorn_conf.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abstract

[coverage:html]
directory = htmlcov