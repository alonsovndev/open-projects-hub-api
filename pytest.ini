[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = -v --tb=short

# Markers
markers =
    unit: Unit tests (domain/application layer with mocked dependencies)
    integration: Integration tests (endpoint tests with mocked use cases)
    e2e: End-to-end tests (require database)
    slow: Slow running tests
    auth: Authentication related tests

# Test paths
testpaths = src/tests