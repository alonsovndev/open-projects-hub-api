app:
  name: Open Projects Hub API
  version: 1.0.0
  # Where emailed links point (verify-email, reset-password).
  frontend_base_url: !ENV ${FRONTEND_BASE_URL:http://localhost:5173}

jwt:
  secret_key: !ENV ${SECRET_KEY}
  algorithm: HS256
  access_token_expire_minutes: 15

cors:
  origins:
  - http://localhost:5173
  allow_credentials: true
  allow_methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - OPTIONS
  allow_headers:
  - Authorization
  - Content-Type
  - Accept

persistence:
  driver: postgresql
  postgres:
    username: open-projects-hub-admin
    password: !ENV ${POSTGRES_PASSWORD}
    host: postgres
    port: 5432
    dbname: open-projects-hub-db
    echo: true
    pool_size: 10
    max_overflow: 10
    pool_timeout: 30
    pool_pre_ping: true

logging:
  level: DEBUG
  format: text
  outputs:
  - type: console

monitoring:
  # Sentry disabled here by choice — console logs are sufficient for this
  # environment. Enable by setting sentry_dsn (see config_prod.yml).
  sentry_dsn: null
  sentry_traces_sample_rate: 0.1

smtp:
  host: !ENV ${SMTP_HOST:localhost}
  port: !ENV ${SMTP_PORT:587}
  username: !ENV ${SMTP_USERNAME}
  password: !ENV ${SMTP_PASSWORD}
  from_address: !ENV ${SMTP_FROM_ADDRESS:no-reply@open-projects-hub.local}
  use_tls: true

auth:
  persist_session_state: true

ai:
  providers:
    gemini:
      model: gemini-3.1-flash-lite
      api_key: !ENV ${GEMINI_API_KEY}
    openai:
      model: gpt-4o-mini
    deepseek:
      model: deepseek-chat

project_limits:
  max_active_per_admin: 3

workspace_limits:
  max_users: 5
  ai_credits_ceiling: 25
  credits_per_user: 5

security:
  # Base64-encoded 32-byte master key for AES-256-GCM encryption of user-supplied
  # provider API keys (F-010 NFR-010-01). Generate with:
  #   python -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())"
  api_key_encryption_key: !ENV ${API_KEY_ENCRYPTION_KEY}
