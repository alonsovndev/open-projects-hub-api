app:
  name: Open Projects Hub API
  version: 1.0.0

jwt:
  secret_key: !ENV ${SECRET_KEY}
  algorithm: HS256
  access_token_expire_minutes: 15

persistence:
  driver: postgresql
  postgres:
    username: open-projects-hub-admin
    password: !ENV ${POSTGRES_PASSWORD}
    host: postgres
    port: 5432
    dbname: open-projects-hub-db
    echo: true
    pool_size: 10
    max_overflow: 10
    pool_timeout: 30
    pool_pre_ping: true

logging:
  level: DEBUG
  format: text
  outputs:
  - type: console

ai:
  provider: gemini    # gemini | mock
  gemini_api_key: !ENV ${GEMINI_API_KEY}
  gemini_model: gemini-2.5-flash
