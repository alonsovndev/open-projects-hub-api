app:
  name: "App API"
  version: "1.0.0"

jwt:
  secret_key: !ENV ${SECRET_KEY}
  algorithm: "HS256"
  access_token_expire_minutes: 15

cors:
  origins:
    - !ENV ${CORS_ORIGINS:http://localhost:5173}
  allow_credentials: true
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Authorization"
    - "Content-Type"
    - "Accept"

postgres:
  username: "open-projects-hub-admin"
  password: !ENV ${POSTGRES_PASSWORD}
  host: "dev-host"
  port: 5432
  dbname: "open-projects-hub-db"
  echo: false
  pool_size: 10
  max_over_flow: 10
  pool_timeout: 30
  pool_pre_ping: true

persistence:
  driver: postgresql
  postgres:
    username: "open-projects-hub-admin"
    password: !ENV ${POSTGRES_PASSWORD}
    host: "dev-host"
    port: 5432
    dbname: "open-projects-hub-db"
    echo: false
    pool_size: 10
    max_overflow: 10
    pool_timeout: 30
    pool_pre_ping: true

logging:
  level: INFO
  format: json
  outputs:
    - type: console
    - type: file
      path: "logs/app.log"
      max_bytes: 52428800
      backup_count: 5
