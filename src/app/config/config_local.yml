app:
  name: "App API"
  version: "1.0.0"

jwt:
  secret_key: !ENV ${SECRET_KEY}
  algorithm: "HS256"
  access_token_expire_minutes: 15  # Reduced from 1440 (24h) to 15min for improved security

cors:
  origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
  allow_credentials: true
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Authorization"
    - "Content-Type"
    - "Accept"

postgres:
  username: "open-projects-hub-admin"
  password: !ENV ${POSTGRES_PASSWORD}
  host: "localhost"
  port: 5432
  dbname: "open-projects-hub-db"
  echo: true  # SQLAlchemy echo logs
  pool_size: 10  # Maximum number of permanent connections
  max_over_flow: 10  # Maximum overflow connections beyond pool_size
  pool_timeout: 30  # Seconds to wait for connection from pool
  pool_pre_ping: true  # Verify connections before using (prevents stale connections)


