app:
  name: Open Projects Hub API
  version: 1.0.0

jwt:
  secret_key: !ENV ${SECRET_KEY}
  algorithm: HS256
  access_token_expire_minutes: 15

cors:
  origins:
  - !ENV ${CORS_ORIGINS}
  allow_credentials: !ENV ${CORS_ALLOW_CREDENTIALS:false}
  allow_methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - OPTIONS
  allow_headers:
  - Authorization
  - Content-Type
  - Accept

persistence:
  driver: postgresql
  postgres:
    username: !ENV ${POSTGRES_USER:open-projects-hub-admin}
    password: !ENV ${POSTGRES_PASSWORD}
    host: !ENV ${POSTGRES_HOST}
    port: !ENV ${POSTGRES_PORT:5432}
    dbname: !ENV ${POSTGRES_DB:open-projects-hub-db}
    echo: false
    pool_size: 10
    max_overflow: 10
    pool_timeout: 30
    pool_pre_ping: true

logging:
  level: INFO
  format: json
  outputs:
  - type: console

monitoring:
  # Sentry error tracking (ADR-009). Set the SENTRY_DSN secret to activate.
  # Not yet provisioned — app.py normalizes unset/placeholder values to None
  # so startup doesn't fail (sentry-sdk's DSN parser rejects a truly empty
  # string, and pyaml_env substitutes "N/A" for an unset var with no default).
  sentry_dsn: !ENV ${SENTRY_DSN}
  sentry_traces_sample_rate: 0.1

ai:
  provider: gemini    # gemini | mock
  gemini_api_key: !ENV ${GEMINI_API_KEY}
  gemini_model: gemini-2.5-flash

project_limits:
  max_active_per_admin: 3
