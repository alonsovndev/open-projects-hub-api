app:
  name: Open Projects Hub API
  version: 1.0.0
  # Where emailed links point (verify-email, reset-password).
  frontend_base_url: !ENV ${FRONTEND_BASE_URL:http://localhost:5173}

jwt:
  secret_key: !ENV ${SECRET_KEY}
  algorithm: HS256
  access_token_expire_minutes: 15

cors:
  origins:
  - !ENV ${CORS_ORIGINS}
  # The bool tag matters: without it pyaml_env yields the truthy string "false".
  allow_credentials: !ENV tag:yaml.org,2002:bool ${CORS_ALLOW_CREDENTIALS:false}
  allow_methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - OPTIONS
  allow_headers:
  - Authorization
  - Content-Type
  - Accept

persistence:
  driver: postgresql
  postgres:
    username: !ENV ${POSTGRES_USER:open-projects-hub-admin}
    password: !ENV ${POSTGRES_PASSWORD}
    host: !ENV ${POSTGRES_HOST}
    port: !ENV ${POSTGRES_PORT:5432}
    dbname: !ENV ${POSTGRES_DB:open-projects-hub-db}
    echo: false
    pool_size: 10
    max_overflow: 10
    pool_timeout: 30
    pool_pre_ping: true

logging:
  level: INFO
  format: json
  outputs:
  - type: console

monitoring:
  # Sentry error tracking (ADR-009). Set the SENTRY_DSN secret to activate.
  # Not yet provisioned — app.py normalizes unset/placeholder values to None
  # so startup doesn't fail (sentry-sdk's DSN parser rejects a truly empty
  # string, and pyaml_env substitutes "N/A" for an unset var with no default).
  sentry_dsn: !ENV ${SENTRY_DSN}
  sentry_traces_sample_rate: 0.1

smtp:
  host: !ENV ${SMTP_HOST}
  port: !ENV ${SMTP_PORT:587}
  username: !ENV ${SMTP_USERNAME}
  password: !ENV ${SMTP_PASSWORD}
  from_address: !ENV ${SMTP_FROM_ADDRESS}
  use_tls: true

auth:
  persist_session_state: true

ai:
  providers:
    gemini:
      model: gemini-3.1-flash-lite
      api_key: !ENV ${GEMINI_API_KEY}
    openai:
      model: gpt-4o-mini
    deepseek:
      model: deepseek-chat

project_limits:
  max_active_per_admin: 3

workspace_limits:
  max_users: 5
  ai_credits_ceiling: 25
  credits_per_user: 5

security:
  # Base64-encoded 32-byte master key for AES-256-GCM encryption of user-supplied
  # provider API keys (F-010 NFR-010-01). Generate with:
  #   python -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())"
  api_key_encryption_key: !ENV ${API_KEY_ENCRYPTION_KEY}
