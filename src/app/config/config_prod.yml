app:
  name: App API
  version: 1.0.0

jwt:
  secret_key: !ENV ${SECRET_KEY}
  algorithm: HS256
  access_token_expire_minutes: 15

cors:
  origins:
  - !ENV ${CORS_ORIGINS}
  allow_credentials: !ENV ${CORS_ALLOW_CREDENTIALS:false}
  allow_methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - OPTIONS
  allow_headers:
  - Authorization
  - Content-Type
  - Accept

postgres:
  username: !ENV ${POSTGRES_USER:open-projects-hub-admin}
  password: !ENV ${POSTGRES_PASSWORD}
  host: !ENV ${POSTGRES_HOST}
  port: !ENV ${POSTGRES_PORT:5432}
  dbname: !ENV ${POSTGRES_DB:open-projects-hub-db}
  echo: false
  pool_size: 10
  max_over_flow: 10
  pool_timeout: 30
  pool_pre_ping: true

persistence:
  driver: postgresql
  postgres:
    username: !ENV ${POSTGRES_USER:open-projects-hub-admin}
    password: !ENV ${POSTGRES_PASSWORD}
    host: !ENV ${POSTGRES_HOST}
    port: !ENV ${POSTGRES_PORT:5432}
    dbname: !ENV ${POSTGRES_DB:open-projects-hub-db}
    echo: false
    pool_size: 10
    max_overflow: 10
    pool_timeout: 30
    pool_pre_ping: true

logging:
  level: INFO
  format: json
  outputs:
  - type: console
  - type: file
    path: /var/log/api/app.log
    max_bytes: 52428800
    backup_count: 10
