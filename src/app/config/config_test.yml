app:
  name: "App API"
  version: "1.0.0"

jwt:
  secret_key: !ENV ${SECRET_KEY}
  algorithm: "HS256"
  access_token_expire_minutes: 1440

postgres:
  username: "templateAdmin"
  password: !ENV ${POSTGRES_PASSWORD}
  host: "test-host"
  port: 5432
  dbname: "templatedb"
  echo: true  # SQLAlchemy echo logs
  pool_size: 10
  max_over_flow: 10
  pool_timeout: 30
