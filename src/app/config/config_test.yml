app:
  name: Open Projects Hub API
  version: 1.0.0

jwt:
  secret_key: !ENV ${SECRET_KEY}
  algorithm: HS256
  access_token_expire_minutes: 1440

persistence:
  driver: postgresql
  postgres:
    username: open-projects-hub-admin
    password: test_password
    host: localhost
    port: 5432
    dbname: open-projects-hub-db
    echo: false

logging:
  level: WARNING
  format: text
  outputs:
  - type: console

monitoring:
  # Sentry disabled here by choice — never send test-run noise to Sentry.
  sentry_dsn: null
  sentry_traces_sample_rate: 0.1

smtp:
  host: localhost
  port: 1025
  username: ""
  password: ""
  from_address: no-reply@open-projects-hub.test
  use_tls: false

auth:
  # Unit/presentation tests mock repositories directly and don't run against
  # a live database; keep lockout/refresh-token state in-memory here so an
  # incidental lockout check doesn't require Postgres. test-integration
  # exercises the real SQL-backed repositories directly, not through this flag.
  persist_session_state: false

ai:
  provider: mock    # gemini | mock
  gemini_api_key: !ENV ${GEMINI_API_KEY}
  gemini_model: gemini-2.5-flash

project_limits:
  max_active_per_admin: 3
