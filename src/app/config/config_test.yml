app:
  name: Open Projects Hub API
  version: 1.0.0

jwt:
  secret_key: !ENV ${SECRET_KEY}
  algorithm: HS256
  access_token_expire_minutes: 1440

persistence:
  driver: postgresql
  postgres:
    username: open-projects-hub-admin
    password: test_password
    host: localhost
    port: 5432
    dbname: open-projects-hub-db
    echo: false

logging:
  level: WARNING
  format: text
  outputs:
  - type: console

monitoring:
  # Sentry disabled here by choice — never send test-run noise to Sentry.
  sentry_dsn: null
  sentry_traces_sample_rate: 0.1

smtp:
  host: localhost
  port: 1025
  username: ""
  password: ""
  from_address: no-reply@open-projects-hub.test
  use_tls: false

auth:
  # Unit/presentation tests mock repositories directly and don't run against
  # a live database; keep lockout/refresh-token state in-memory here so an
  # incidental lockout check doesn't require Postgres. test-integration
  # exercises the real SQL-backed repositories directly, not through this flag.
  persist_session_state: false

ai:
  provider: mock    # gemini | openai | deepseek | mock
  providers:
    gemini:
      model: gemini-3.1-flash-lite
      api_key: !ENV ${GEMINI_API_KEY}
    openai:
      model: gpt-4o-mini
      api_key: !ENV ${OPENAI_API_KEY}
    deepseek:
      model: deepseek-chat
      api_key: !ENV ${DEEPSEEK_API_KEY}

project_limits:
  max_active_per_admin: 3

security:
  # Base64-encoded 32-byte master key for AES-256-GCM encryption of user-supplied
  # provider API keys (F-010 NFR-010-01). Generate with:
  #   python -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())"
  # The default below is a throwaway for local runs and tests only — it is public,
  # and dev/container/prod deliberately have no default so they fail fast if unset.
  api_key_encryption_key: !ENV ${API_KEY_ENCRYPTION_KEY:e1JAjWsfRnbIaruC3MN7agn7EcesDo1HKQOwMo5o5pk=}
